[project]
name = "kuyruk"
version = "0.1.0"
description = "A small, well-tested FastAPI job service for long Turkish text jobs."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
