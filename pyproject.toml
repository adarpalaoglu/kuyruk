# Kuyruk's project file: its name, the exact versions of the libraries it
# needs, and the settings of its tools (ruff for style, pytest for tests).
# Change dependencies only with `uv add` / `uv remove`, which also update
# uv.lock (the full list of every library version actually installed).

[project]
name = "kuyruk"
version = "0.1.0"
description = "A small, well-tested FastAPI job service for long Turkish text jobs."
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.8",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.2",
    "pyjwt==2.15.1",
    "python-multipart==0.0.33",
    "sqlmodel==0.0.48",
    "uvicorn==0.54.0",
]

[dependency-groups]
# Needed only for development and tests, not to run Kuyruk.
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Rule groups: E/F basic errors, I import order, B likely bugs,
# UP newer Python style.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always measure coverage (how much of app/ the tests run) and fail below 85%.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
