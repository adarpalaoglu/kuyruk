<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kuyruk – System status</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2347D6}a:hover{color:#1A36A8}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1D1D1F; background: #FFFFFF; min-height: 100vh">
  <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 40px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1D1D1F; font-weight: 600; font-size: 18px; letter-spacing: -0.01em">
      <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="5" width="24" height="4" rx="2" fill="#1D1D1F"></rect><rect x="2" y="12" width="17" height="4" rx="2" fill="#1D1D1F" opacity="0.55"></rect><rect x="2" y="19" width="10" height="4" rx="2" fill="#1D1D1F" opacity="0.25"></rect></svg>
      Kuyruk
      <span style="font-size: 11px; font-weight: 600; color: #6E6E73; border: 1px solid #D2D2D7; border-radius: 999px; padding: 2px 8px; letter-spacing: 0.02em">DEMO</span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 14px">
      <a href="NewJob.dc.html" style="color: #1D1D1F; text-decoration: none">New job</a>
      <a href="Jobs.dc.html" style="color: #1D1D1F; text-decoration: none">My jobs</a>
      <a href="Behind.dc.html" style="color: #1D1D1F; text-decoration: none">Behind the scenes</a>
      <button type="button" aria-label="Language: English. Switch to Turkish" style="font: inherit; font-size: 14px; color: #6E6E73; background: none; border: 0; padding: 10px 4px; min-height: 44px">TR</button>
      <button type="button" aria-label="Account menu for ayse" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: #F5F5F7; color: #1D1D1F; font: inherit; font-size: 14px; font-weight: 600">A</button>
    </nav>
  </header>

  <main style="max-width: 720px; margin: 0 auto; padding: 72px 32px 96px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2347D6" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
      <h1 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.03em">Everything is working.</h1>
      <p style="margin: 0; font-size: 17px; color: #6E6E73">Checked 3 seconds ago.</p>
    </div>

    <dl style="margin: 0; display: flex; flex-direction: column; border-top: 1px solid #E8E8ED">
      <sc-for list="{{ parts }}" as="p" hint-placeholder-count="5">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; padding: 20px 0; border-bottom: 1px solid #E8E8ED">
          <dt style="font-size: 17px; font-weight: 600">{{ p.name }}</dt>
          <dd style="margin: 0; font-size: 15px; color: #6E6E73; text-align: right">{{ p.detail }}</dd>
        </div>
      </sc-for>
    </dl>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      parts: [
        { name: 'API', detail: 'Working · answered in 6 ms' },
        { name: 'Worker', detail: 'Working · last heartbeat 1 second ago · on 1 job' },
        { name: 'Database', detail: 'Working' },
        { name: 'AI', detail: 'Demo AI · replays times measured on Gemma 4 E4B' },
        { name: 'Queue', detail: '2 jobs waiting' }
      ]
    };
  }
}
</script>
</body>
</html>
