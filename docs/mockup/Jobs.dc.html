<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kuyruk – My jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2347D6}a:hover{color:#1A36A8}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1D1D1F; background: #FFFFFF; min-height: 100vh">
  <header style="position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 40px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1D1D1F; font-weight: 600; font-size: 18px; letter-spacing: -0.01em">
      <svg width="22" height="22" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="5" width="24" height="4" rx="2" fill="#1D1D1F"></rect><rect x="2" y="12" width="17" height="4" rx="2" fill="#1D1D1F" opacity="0.55"></rect><rect x="2" y="19" width="10" height="4" rx="2" fill="#1D1D1F" opacity="0.25"></rect></svg>
      Kuyruk
      <span style="font-size: 11px; font-weight: 600; color: #6E6E73; border: 1px solid #D2D2D7; border-radius: 999px; padding: 2px 8px; letter-spacing: 0.02em">DEMO</span>
    </a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 14px">
      <a href="NewJob.dc.html" style="color: #1D1D1F; text-decoration: none">New job</a>
      <a href="Jobs.dc.html" aria-current="page" style="color: #1D1D1F; font-weight: 600; text-decoration: none">My jobs</a>
      <a href="Behind.dc.html" style="color: #1D1D1F; text-decoration: none">Behind the scenes</a>
      <button type="button" aria-label="Language: English. Switch to Turkish" style="font: inherit; font-size: 14px; color: #6E6E73; background: none; border: 0; padding: 10px 4px; min-height: 44px">TR</button>
      <button type="button" aria-label="Account menu for ayse" aria-expanded="true" style="width: 36px; height: 36px; border-radius: 50%; border: 2px solid #2347D6; background: #F5F5F7; color: #1D1D1F; font: inherit; font-size: 14px; font-weight: 600">A</button>
    </nav>
    <div role="menu" aria-label="Account" style="position: absolute; right: 32px; top: 70px; width: 300px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,0.14), 0 0 0 1px rgba(0,0,0,0.04); padding: 20px; display: flex; flex-direction: column; gap: 16px; z-index: 2">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #6E6E73">Signed in as</span>
        <strong style="font-size: 16px">ayse</strong>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #6E6E73">AI budget today</span>
        <div role="img" aria-label="57,500 of 200,000 tokens used" style="height: 6px; background: #E8E8ED; border-radius: 3px; overflow: hidden"><div style="width: 28.75%; height: 100%; background: #2347D6"></div></div>
        <span style="font-size: 15px"><strong>142,500</strong> tokens left · resets 03:00</span>
      </div>
      <div style="border-top: 1px solid #E8E8ED; padding-top: 8px; display: flex; flex-direction: column">
        <a role="menuitem" href="Status.dc.html" style="color: #1D1D1F; text-decoration: none; font-size: 15px; padding: 12px 0">System status</a>
        <a role="menuitem" href="https://example.com/docs" style="color: #1D1D1F; text-decoration: none; font-size: 15px; padding: 12px 0">API docs</a>
        <a role="menuitem" href="Login.dc.html" style="color: #1D1D1F; text-decoration: none; font-size: 15px; padding: 12px 0">Log out</a>
      </div>
    </div>
  </header>

  <main style="max-width: 880px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <h1 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.03em">My jobs</h1>
      <div role="group" aria-label="Show" style="display: flex; flex-wrap: wrap; gap: 4px; font-size: 14px">
        <button type="button" aria-pressed="true" style="font: inherit; font-size: 14px; border: 0; border-radius: 999px; background: #1D1D1F; color: #FFFFFF; padding: 8px 14px; min-height: 36px">All</button>
        <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; border: 0; border-radius: 999px; background: transparent; color: #1D1D1F; padding: 8px 14px; min-height: 36px">Running</button>
        <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; border: 0; border-radius: 999px; background: transparent; color: #1D1D1F; padding: 8px 14px; min-height: 36px">Done</button>
        <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; border: 0; border-radius: 999px; background: transparent; color: #1D1D1F; padding: 8px 14px; min-height: 36px">Failed</button>
        <button type="button" aria-pressed="false" style="font: inherit; font-size: 14px; border: 0; border-radius: 999px; background: transparent; color: #1D1D1F; padding: 8px 14px; min-height: 36px">Cancelled</button>
      </div>
    </div>

    <ul style="margin: 0; padding: 0; list-style: none; border-top: 1px solid #E8E8ED">
      <sc-for list="{{ jobs }}" as="job" hint-placeholder-count="6">
        <li style="border-bottom: 1px solid #E8E8ED">
          <a href="{{ job.href }}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 22px 4px; text-decoration: none; color: #1D1D1F">
            <span style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
              <strong style="font-size: 17px; font-weight: 600">{{ job.title }}</strong>
              <span style="font-size: 14px; color: #6E6E73">{{ job.meta }}</span>
            </span>
            <span style="flex: 0 0 auto; font-size: 15px; color: #6E6E73">{{ job.count }}</span>
            <span style="flex: 0 0 120px; text-align: right; font-size: 15px; font-weight: 600; color: {{ job.color }}">{{ job.state }}</span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>

        { title: 'Summarise · 20 reviews', meta: 'Sent yesterday, 16:05 · ticket 2f6b0d1', count: '8 of 20', state: 'Cancelled', color: '#6E6E73', href: 'Results.dc.html' },
        { title: 'Summarise · 60 reviews', meta: 'Sent yesterday, 09:48 · ticket c91a7e3', count: 'AI unavailable', state: 'Failed', color: '#B42318', href: 'Results.dc.html' }
      ]
    };
  }
}
</script>
</body>
</html>
