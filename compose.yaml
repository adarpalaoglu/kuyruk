# Docker Compose file: describes the programs ("services") Kuyruk runs in
# containers, so one command (`docker compose up`) starts them all:
#
#   db      the Postgres 16 database (users, jobs, texts)
#   api     the web service: /docs, /register, /jobs ... at http://localhost:8000
#   worker  the separate program that does the jobs (spec 7)
#   web     the web interface at http://localhost:8080 (spec 10, D115)
#
# Start order: db healthy -> api starts, creates the tables, healthy -> worker
# and web start (D78).
#
# DEMO MODE BY DEFAULT (D80). With no `.env` file, everything below falls back
# to clearly labelled demo-only values, so Kuyruk runs on a clean machine with
# nothing to fill in: the fake AI, short heartbeat times, the crash button on,
# and a public demo password and login key. Those are not secrets (they are
# written right here), which is why Kuyruk refuses the demo login key unless
# DEMO_MODE is true, and why the ports below open only to this computer.
#
# REAL USE: copy .env.example to .env and set real secrets and DEMO_MODE=false
# (see .env.example). `${NAME:-value}` means "NAME from .env (or the shell) if
# set, otherwise value", so anything in .env wins.

# Settings shared by the api and the worker (`&kuyruk-app` names this block;
# `<<: *kuyruk-app` below pastes it in).
x-kuyruk-app: &kuyruk-app
  # Both are built from ./Dockerfile. No fixed image name on purpose: Docker
  # names the images after the project (e.g. kuyruk-api, kuyruk-worker), so
  # a second project, such as the clean-machine check (kuyruk-check), never
  # overwrites or deletes this one's images (D86). The two share every layer,
  # so the second name costs no extra disk space.
  build: .
  # Every other setting in .env (e.g. DAILY_TOKEN_BUDGET) reaches Kuyruk too.
  # "required: false": no .env is fine (the demo).
  env_file:
    - path: .env
      required: false
  environment:
    DEMO_MODE: ${DEMO_MODE:-true}
    # The public demo login key (app/settings.py DEMO_JWT_SECRET). Refused
    # outside demo mode.
    JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-public-not-for-real-use}
    # "db" is the database container's name on Docker's private network.
    # Always built here; a DATABASE_URL in .env (for the Mac) doesn't apply.
    DATABASE_URL: postgresql+psycopg://kuyruk:${POSTGRES_PASSWORD:-demo-only-db-password}@db:5432/kuyruk
    # The fake AI, replaying the real AI's waiting times: Gemma's per-text
    # times measured at 4 texts at once, the worker's setting (Slice 10, D93).
    AI_BACKEND: ${AI_BACKEND:-fake}
    FAKE_AI_WAIT_MODE: ${FAKE_AI_WAIT_MODE:-replay}
    FAKE_AI_REPLAY_FILE: ${FAKE_AI_REPLAY_FILE:-bench/data/ollama_times_at_4.csv}
    # Demo timings (D81): a heartbeat every second and "stuck" after 5 seconds
    # without one, so a crash is recovered within seconds on screen. Real use
    # sets 5 and 30 in .env (the defaults in app/settings.py).
    HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-1}
    STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-5}
    # Ollama runs on the Mac itself, not in Docker (D08). From inside a
    # container, the Mac is "host.docker.internal". Fixed here, like
    # DATABASE_URL, so a .env written for running Kuyruk directly on the Mac
    # (localhost addresses) can't point the containers at the wrong place.
    OLLAMA_URL: http://host.docker.internal:11434
    # The worker's "I'm alive" file for its health check (D79). Only the
    # worker writes it. It sits in /tmp, which the api and worker share (the
    # `worker-alive` volume below), so the API's GET /status can read how old
    # it is: the worker's last sign of life (D118).
    WORKER_ALIVE_FILE: /tmp/kuyruk-worker-alive
    # The web interface's address: the only website allowed to call the API
    # from a browser (CORS, D121). Must match the web service's port below.
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}

services:
  db:
    # Postgres 16, pinned to an exact version and its fingerprint (digest), so
    # the same image is used on every machine and forever, even if the
    # "16.15-alpine" label is later moved. "alpine" is a small Linux base.
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: kuyruk
      POSTGRES_DB: kuyruk
      # From .env for real use; otherwise the public demo password (D80).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-only-db-password}
    ports:
      # Lets programs on this computer reach the database at localhost:5432
      # (e.g. the Postgres tests). 127.0.0.1 = this computer only: with a
      # public demo password, other machines on the network must not get in.
      - "127.0.0.1:5432:5432"
    volumes:
      # Keep the data in a named Docker volume so it survives restarts.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready asks Postgres "are you accepting connections?"; Docker marks
      # the service "healthy" once it says yes.
      test: ["CMD-SHELL", "pg_isready -U kuyruk -d kuyruk"]
      interval: 5s
      timeout: 5s
      retries: 10
      # While starting, check every second, so the others can start sooner.
      start_period: 30s
      start_interval: 1s

  api:
    <<: *kuyruk-app
    # The image's own start command: uvicorn serving the API.
    ports:
      # Open http://localhost:8000/docs in a browser. This computer only.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # /tmp shared with the worker, so the API can read the worker's alive
      # file (D118); the API itself writes nothing there.
      - worker-alive:/tmp
    healthcheck:
      # Ask GET /health. The image has no curl, so Python does it; any error
      # (no answer, not 200) makes it exit with an error code: unhealthy. The
      # API only answers after its start-up step has created the tables, so
      # "healthy" also means "tables exist" (D78).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  worker:
    <<: *kuyruk-app
    # Python itself is the container's first process (not `uv run`), so
    # Docker's stop signal (SIGTERM) and kill signal (SIGKILL) reach the worker
    # directly. With `uv run` in between, a kill stopped only uv while the
    # worker carried on (found in Slice 8).
    # First a tiny shell step deletes an "I'm alive" file left by an earlier
    # worker: the shared /tmp volume outlives the container (D118), and an old
    # file must not make a new worker look healthy before its loop has turned
    # once. `exec` then *replaces* the shell with Python, so Python is still
    # the first process and still receives the signals. (Done here rather than
    # in app/worker.py, whose lines E2 counted, D104.)
    command: ["sh", "-c", "rm -f \"$$WORKER_ALIVE_FILE\" && exec python -m app.worker"]
    depends_on:
      # Only the API creates tables, so the worker waits until it is healthy.
      api:
        condition: service_healthy
    # If the worker stops for any reason (a crash, or the demo crash button),
    # Docker starts it again at once, and the new worker takes over the stuck
    # job (spec 7.1). Only `docker compose stop`/`down` stops it for good.
    restart: unless-stopped
    # After asking the worker to stop, Docker waits this long before killing
    # it. Must be above SHUTDOWN_GRACE_SECONDS (8 s), the worker's own wait for
    # texts still with the AI (D55).
    stop_grace_period: 12s
    # Makes host.docker.internal (Ollama's address above) work on Linux too;
    # Docker Desktop on a Mac already provides it. On Linux, Ollama must also
    # listen beyond localhost (OLLAMA_HOST=0.0.0.0).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Where the worker writes its alive file, shared with the api (D118).
      # /tmp because in both images it is writable by every user: a new
      # Docker volume copies that, so the worker (a normal user, not root)
      # can write there without changing the Dockerfile.
      - worker-alive:/tmp
    healthcheck:
      # Healthy while the worker keeps re-dating its "I'm alive" file: about
      # every second when idle, every heartbeat during a job (D79). Docker only
      # reports "unhealthy"; a crashed worker is restarted by `restart` above.
      test: ["CMD", "python", "-m", "app.worker", "--check-alive"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s

  web:
    # The web interface (Slice 17, D115): plain HTML, CSS and JavaScript files
    # from ./web, handed out by nginx, a small web server. "unprivileged" is
    # the variant that runs as a normal user, not as the all-powerful root.
    # Pinned to an exact version and its fingerprint (digest), like Postgres.
    # It is a separate address (port 8080) from the API (port 8000), so the
    # browser's cross-site rule (CORS) is really in play.
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    environment:
      # The API's address as the browser sees it; nginx writes it into
      # /config.js for the pages, and into its safety header (only this site
      # and the API may be talked to).
      WEB_API_URL: ${WEB_API_URL:-http://localhost:8000}
    volumes:
      # The files are used straight from the repo, read-only: no build step.
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      # Open http://localhost:8080 in a browser. This computer only.
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Ask nginx for the Welcome page; busybox `wget` is inside the image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 1s

volumes:
  db-data:
  # The /tmp folder the api and worker share, for the worker's alive file
  # (D118).
  worker-alive:
