<!doctype html>
<!-- Create your account (docs/mockup/Login.dc.html, D126): username,
     password and the password again, POST /register and then POST /token.
     Logging in is its own page, login.html. js/pages/signup.js. -->
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuyruk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="config.js"></script>
<script type="module" src="js/pages/signup.js"></script>
</head>
<body data-page="signup">
<a class="skip-link" href="#main" data-i18n="header.skip"></a>
<header class="site-header" id="site-header"></header>
<main id="main" class="narrow">
  <div class="page-head">
    <h1 data-i18n="login.signup_title"></h1>
    <p id="signup-sub"></p>
  </div>
  <form class="form" id="signup-form" novalidate>
    <label for="username" class="sr-only" data-i18n="login.username"></label>
    <input class="input" id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="userhint" data-i18n-placeholder="login.username">
    <label for="password" class="sr-only" data-i18n="login.password"></label>
    <input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="userhint" data-i18n-placeholder="login.password">
    <label for="confirm" class="sr-only" data-i18n="login.confirm"></label>
    <input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required data-i18n-placeholder="login.confirm">
    <p class="hint" id="userhint" hidden></p>
    <p class="message" id="signup-error" role="alert" hidden></p>
    <button class="btn btn-primary" type="submit" id="signup-submit"></button>
  </form>
  <p class="switch-line"><span data-i18n="login.have_account"></span> <a id="switch-link" href="login.html" data-i18n="login.to_login"></a></p>
</main>
</body>
</html>
