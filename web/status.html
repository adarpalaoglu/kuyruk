<!doctype html>
<!-- System status (docs/mockup/Status.dc.html): is every part of Kuyruk
     working? Reads the public GET /status every 5 seconds.
     js/pages/status.js. -->
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuyruk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script src="config.js"></script>
<script type="module" src="js/pages/status.js"></script>
</head>
<body data-page="status">
<a class="skip-link" href="#main" data-i18n="header.skip"></a>
<header class="site-header" id="site-header"></header>
<main id="main" class="status-main">
  <div class="status-top">
    <svg id="icon-ok" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2347D6" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M7.5 12.5l3 3 6-6.5"></path></svg>
    <svg id="icon-bad" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.6" aria-hidden="true" hidden><circle cx="12" cy="12" r="10"></circle><path d="M12 7v6.5M12 16.5v.5"></path></svg>
    <h1 class="page-title" id="status-title" aria-live="polite"></h1>
    <p id="checked"></p>
  </div>
  <dl class="parts" id="parts"></dl>
</main>
</body>
</html>
